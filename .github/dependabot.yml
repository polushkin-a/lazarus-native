# NuGet packages and the CI actions: monthly PRs; the build must pass before anything merges.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/SensorBridge", "/KeyHook"]
    schedule:
      interval: monthly
    ignore:
      # The runtime's own packages follow the runtime's major (10.x while we target .NET 10): a new major comes with
      # moving the target framework, deliberately — not as a package bump against an older runtime.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
