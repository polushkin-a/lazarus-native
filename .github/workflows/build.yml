name: Build

# Every push and pull request: both programs build from this source, and the unsigned binaries are kept with their
# SHA-256 sums. Release binaries are built from a tag and signed by the maintainer (CODE_SIGNING_POLICY.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish SensorBridge/SensorBridge.csproj -c Release -r win-x64 --self-contained -o out/SensorBridge
      - run: dotnet publish KeyHook/KeyHook.csproj -c Release -r win-x64 --self-contained -o out/KeyHook
      - name: SHA-256 sums
        shell: pwsh
        run: |
          Get-ChildItem out -Recurse -File -Include *.exe, *.dll |
            Sort-Object FullName |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $([IO.Path]::GetRelativePath('out', $_.FullName).Replace('\', '/'))" } |
            Set-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: lazarus-native-${{ github.sha }}
          path: out
